[project]
name = "wows-backend"
version = "0.1.0"
description = "FastAPI backend for World of Warships Stats Tracker"
authors = [
    { name = "MoliangZhou", email = "moliangzhou@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlmodel>=0.0.8",
    "psycopg2-binary>=2.9.6",
    "httpx>=0.24.1",
    "pydantic>=2.0",
    "aiolimiter>=1.1.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=14.0.0",
    "boto3>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "pytest-mock>=3.11.1",
    "ruff>=0.0.284",
    "mypy>=1.5.1"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "database*", "worker*"]
