version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wows-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wows-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  scraper:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wows-scraper
    command: python -u -m worker.updater
    env_file:
      - ./backend/.env
    volumes:
      - scraper_data:/app/data
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  scraper_data:
